name: ci

# Everything that can run WITHOUT a 120 MB model artifact. The parity gate
# itself needs the artifacts and lives in parity-gate.yml, which fails closed
# rather than skipping when it cannot get them.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev,parity]"

      # `python -m pytest`, not bare `pytest`: only the -m form puts the working
      # directory on sys.path, and export/ lives at the repo root — the
      # packaging config exposes src/ only, so a bare pytest cannot import it.
      - name: Unit tests
        run: python -m pytest tests/ -q

      # A check that never fires in a test is a comment, not a gate. These are
      # the refusals this repo relies on; assert each is actually asserted
      # somewhere, so deleting the assertion turns CI red instead of quietly
      # leaving a comment behind.
      - name: Prove the refusals are asserted
        run: |
          set -euo pipefail
          fail=0
          for k in PrecisionMismatchError VersionCollisionError MissingParityError ImmutableRecordError; do
            n=$(grep -rc "pytest.raises($k" tests/ | awk -F: '{s+=$2} END{print s+0}')
            echo "$k -> $n pytest.raises"
            [ "$n" -gt 0 ] || { echo "::error::no pytest.raises for $k"; fail=1; }
          done
          n=$(grep -rc "_check_class_alignment" tests/test_export_rfdetr.py | awk -F: '{print $NF+0}')
          echo "_check_class_alignment -> $n references"
          [ "$n" -gt 0 ] || { echo "::error::class-order gate has no test"; fail=1; }
          exit $fail

      # Recomputes record_id from the identity block. Catches a hand-edited
      # record. Deliberately does NOT hash the artifacts — they are 36-120 MB
      # and live in S3, so that check belongs to the release gate, not here.
      # The identity check below catches a hand-edited record. It does NOT
      # catch a wrong parity pin, and that gap let two engine records sit with
      # reportSha256 hashes taken over a CRLF rendering of an LF file. Note
      # this runner is POSIX, so it would have passed them before .gitattributes
      # forced eol=lf — a POSIX-only check is necessary and not sufficient,
      # which is why both landed together.
      - name: Parity pins match the reports they name
        run: |
          python - <<'PY'
          import glob, hashlib, json, pathlib, sys
          bad = []
          for f in sorted(glob.glob("registry/*.json")):
              rec = json.load(open(f))
              par = rec.get("parity") or {}
              rep = pathlib.Path(par.get("report", ""))
              if not rep.exists():
                  bad.append((f, f"parity report not found: {rep}"))
                  continue
              got = hashlib.sha256(rep.read_bytes()).hexdigest()
              if got != par.get("reportSha256"):
                  bad.append((f, f"pinned {par.get('reportSha256','')[:12]} but {rep} hashes to {got[:12]}"))
          for f, why in bad:
              print(f"::error file={f}::{why}")
          print(f"{len(glob.glob('registry/*.json'))} parity pins checked")
          sys.exit(1 if bad else 0)
          PY

      # Guards the guard: if this file stops forcing LF, every hash above
      # becomes platform-dependent again and the checks go quietly green on
      # a POSIX runner while failing on a Windows checkout.
      - name: Line-ending policy is still in force
        run: |
          set -euo pipefail
          test -f .gitattributes || { echo "::error::.gitattributes is gone — hashes become platform-dependent"; exit 1; }
          grep -qE '^\*\.json[[:space:]]+text[[:space:]]+eol=lf' .gitattributes \
            || { echo "::error::.gitattributes no longer pins *.json to eol=lf"; exit 1; }
          echo "eol=lf policy present"

      - name: Registry records match their own digests
        run: |
          python - <<'PY'
          import glob, hashlib, json, sys
          from export.registry import canonical_bytes
          bad = []
          files = sorted(glob.glob("registry/*.json"))
          for f in files:
              rec = json.load(open(f))
              got = hashlib.sha256(canonical_bytes(rec["identity"])).hexdigest()
              if got != rec["recordId"]:
                  bad.append((f, rec["recordId"], got))
          for f, want, got in bad:
              print(f"::error file={f}::recordId {want[:12]} but identity hashes to {got[:12]}")
          if not files:
              print("::error::no registry records found")
              sys.exit(1)
          print(f"{len(files)} registry records verified")
          sys.exit(1 if bad else 0)
          PY
