[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litter-detector-baseline"
version = "0.1.0"
description = "Public baseline detector for litter detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
export = [
    "ultralytics>=8.0",
]
train = [
    "ultralytics>=8.3",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "Pillow>=10.0",
]
ingest = [
    "boto3>=1.34",
    "botocore[crt]>=1.34",
    "requests>=2.31",
    "Pillow>=10.0",        # resize downloaded OLM images to imgsz=1280 before R2 upload
    "pillow-heif>=0.16",   # iPhone HEIC support (OLM has many .HEIC uploads)
]
parity = [
    # Model-conversion quality tooling. Deliberately NOT in the required
    # dependency set: the reference ONNX Runtime backend must stay
    # installable without pulling a conversion toolchain.
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "Pillow>=10.0",
]
trt = [
    # TensorRT engine build + engine-vs-ONNX parity (export/trt_build.py,
    # export/trt_parity.py). Deliberately NOT required, and deliberately
    # separate from `parity`: this pulls a CUDA-linked toolchain that only
    # resolves on an NVIDIA host, while `parity` must stay installable on
    # the arm64/CPU machines that run the reference backend.
    "tensorrt>=10",
    "cuda-python>=12",
    "polygraphy>=0.49",
    "onnxruntime-gpu>=1.18",
    "onnx>=1.16",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "boto3>=1.34",
    "botocore[crt]>=1.34",
    "requests>=2.31",
    "moto[s3]>=5.0",
]

[project.scripts]
litter-detector-baseline = "litter_detector_baseline.__main__:main"
litter-detector-ingest = "litter_detector_baseline.ingest.__main__:main"
# Training-pipeline entry points are invoked as ``python -m training.X``
# from the repo root (per docs/training_quickstart.md). The ``training/``
# tree lives at the repo root, not under ``src/``, so console_scripts
# bindings don't resolve after pip install — keep them out of here.

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
